syntax = "proto3";

package judgment.v1;

import "google/api/annotations.proto";
import "google/type/date.proto";

option go_package = "github.com/qkitzero/fitness-service/gen/go/judgment/v1";

service JudgmentService {
  rpc GetJudgment(GetJudgmentRequest) returns (GetJudgmentResponse) {
    option (google.api.http) = {get: "/v1/measurement/{measurement_id}/judgment"};
  }
  rpc ListOrganizationJudgments(ListOrganizationJudgmentsRequest) returns (ListOrganizationJudgmentsResponse) {
    option (google.api.http) = {get: "/v1/organization/{organization_id}/judgments"};
  }
  rpc UpsertJudgmentAdvice(UpsertJudgmentAdviceRequest) returns (UpsertJudgmentAdviceResponse) {
    option (google.api.http) = {
      put: "/v1/measurement/{measurement_id}/judgment/advice"
      body: "*"
    };
  }
  rpc UpsertPrescription(UpsertPrescriptionRequest) returns (UpsertPrescriptionResponse) {
    option (google.api.http) = {
      put: "/v1/measurement/{measurement_id}/prescription"
      body: "*"
    };
  }
  rpc DeletePrescription(DeletePrescriptionRequest) returns (DeletePrescriptionResponse) {
    option (google.api.http) = {delete: "/v1/measurement/{measurement_id}/prescription"};
  }
}

enum Rank {
  RANK_UNSPECIFIED = 0;
  RANK_A = 1;
  RANK_B = 2;
  RANK_C = 3;
  RANK_D = 4;
  RANK_E = 5;
}

enum Element {
  ELEMENT_UNSPECIFIED = 0;
  ELEMENT_MUSCLE_STRENGTH = 1;
  ELEMENT_MUSCLE_ENDURANCE = 2;
  ELEMENT_FLEXIBILITY = 3;
  ELEMENT_AGILITY = 4;
  ELEMENT_BALANCE = 5;
  ELEMENT_MOBILITY = 6;
}

enum PrescriptionSource {
  PRESCRIPTION_SOURCE_UNSPECIFIED = 0;
  PRESCRIPTION_SOURCE_ELEMENT = 1;
  PRESCRIPTION_SOURCE_FIXED = 2;
  PRESCRIPTION_SOURCE_AGE_DECADE = 3;
  PRESCRIPTION_SOURCE_MANUAL = 4;
}

enum PrescribedPart {
  PRESCRIBED_PART_UNSPECIFIED = 0;
  PRESCRIBED_PART_UPPER_LIMB = 1;
  PRESCRIBED_PART_LOWER_LIMB = 2;
  PRESCRIBED_PART_WHOLE_BODY = 3;
}

enum PrescribedUnit {
  PRESCRIBED_UNIT_UNSPECIFIED = 0;
  PRESCRIBED_UNIT_REPS = 1;
  PRESCRIBED_UNIT_SECONDS = 2;
  PRESCRIBED_UNIT_MINUTES = 3;
}

message ItemEvaluation {
  string measurement_item_id = 1;
  double value = 2;
  double mean = 3;
  double z_score = 4;
  Rank rank = 5;
}

message ElementEvaluation {
  Element element = 1;
  double z_score = 2;
  Rank rank = 3;
}

message PrescribedMenu {
  PrescriptionSource source = 1;
  optional Element element = 2;
  optional PrescribedPart part = 3;
  string training_menu_id = 4;
  string training_menu_name = 5;
  uint32 amount = 6;
  PrescribedUnit unit = 7;
  uint32 sets = 8;
}

message PrescribedMenuInput {
  optional Element element = 1;
  optional PrescribedPart part = 2;
  string training_menu_id = 3;
  uint32 amount = 4;
  PrescribedUnit unit = 5;
  uint32 sets = 6;
}

message Judgment {
  string measurement_id = 1;
  repeated ItemEvaluation item_evaluations = 2;
  repeated ElementEvaluation element_evaluations = 3;
  optional uint32 motor_age = 4;
  optional string advice = 5;
  bool is_draft = 6;
  repeated PrescribedMenu prescribed_menus = 7;
}

message OrganizationJudgment {
  string customer_id = 1;
  string measurement_id = 2;
  google.type.Date measured_on = 3;
  uint32 age_at_measurement = 4;
  bool is_draft = 5;
  repeated ItemEvaluation item_evaluations = 6;
  repeated ElementEvaluation element_evaluations = 7;
  optional uint32 motor_age = 8;
}

message GetJudgmentRequest {
  string measurement_id = 1;
}

message GetJudgmentResponse {
  Judgment judgment = 1;
}

message ListOrganizationJudgmentsRequest {
  string organization_id = 1;
  bool include_inactive = 2;
}

message ListOrganizationJudgmentsResponse {
  repeated OrganizationJudgment judgments = 1;
}

message UpsertJudgmentAdviceRequest {
  string measurement_id = 1;
  optional string advice = 2;
}

message UpsertJudgmentAdviceResponse {
  string measurement_id = 1;
  optional string advice = 2;
}

message UpsertPrescriptionRequest {
  string measurement_id = 1;
  repeated PrescribedMenuInput prescribed_menus = 2;
}

message UpsertPrescriptionResponse {
  string measurement_id = 1;
  repeated PrescribedMenu prescribed_menus = 2;
}

message DeletePrescriptionRequest {
  string measurement_id = 1;
}

message DeletePrescriptionResponse {}
