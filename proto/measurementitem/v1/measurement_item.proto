syntax = "proto3";

package measurementitem.v1;

import "google/api/annotations.proto";

option go_package = "github.com/qkitzero/fitness-service/gen/go/measurementitem/v1";

service MeasurementItemService {
  rpc ListMeasurementItems(ListMeasurementItemsRequest) returns (ListMeasurementItemsResponse) {
    option (google.api.http) = {get: "/v1/measurement-items"};
  }
}

enum Category {
  CATEGORY_UNSPECIFIED = 0;
  CATEGORY_VITAL = 1;
  CATEGORY_PHYSIQUE = 2;
  CATEGORY_BODY_COMPOSITION = 3;
  CATEGORY_MOTOR_FUNCTION = 4;
}

enum Unit {
  UNIT_UNSPECIFIED = 0;
  UNIT_KG = 1;
  UNIT_CM = 2;
  UNIT_SEC = 3;
  UNIT_COUNT = 4;
  UNIT_MMHG = 5;
  UNIT_PERCENT = 6;
  UNIT_BPM = 7;
  UNIT_LEVEL = 8;
}

enum SideMode {
  SIDE_MODE_UNSPECIFIED = 0;
  SIDE_MODE_NONE = 1;
  SIDE_MODE_BILATERAL = 2;
  SIDE_MODE_OPTIONAL_BILATERAL = 3;
}

enum ValueType {
  VALUE_TYPE_UNSPECIFIED = 0;
  VALUE_TYPE_NUMERIC = 1;
  VALUE_TYPE_PAIRED = 2;
  VALUE_TYPE_CHOICE = 3;
}

enum Normalization {
  NORMALIZATION_UNSPECIFIED = 0;
  NORMALIZATION_NONE = 1;
  NORMALIZATION_HEIGHT_RATIO = 2;
}

enum ScoreDirection {
  SCORE_DIRECTION_UNSPECIFIED = 0;
  SCORE_DIRECTION_HIGHER_IS_BETTER = 1;
  SCORE_DIRECTION_LOWER_IS_BETTER = 2;
}

enum TrialAggregation {
  TRIAL_AGGREGATION_UNSPECIFIED = 0;
  TRIAL_AGGREGATION_MEAN = 1;
  TRIAL_AGGREGATION_BEST = 2;
}

enum SideAggregation {
  SIDE_AGGREGATION_UNSPECIFIED = 0;
  SIDE_AGGREGATION_MEAN = 1;
  SIDE_AGGREGATION_BEST = 2;
  SIDE_AGGREGATION_WORST = 3;
}

enum ItemElement {
  ITEM_ELEMENT_UNSPECIFIED = 0;
  ITEM_ELEMENT_MUSCLE_STRENGTH = 1;
  ITEM_ELEMENT_MUSCLE_ENDURANCE = 2;
  ITEM_ELEMENT_FLEXIBILITY = 3;
  ITEM_ELEMENT_AGILITY = 4;
  ITEM_ELEMENT_BALANCE = 5;
  ITEM_ELEMENT_MOBILITY = 6;
}

message MeasurementItem {
  string measurement_item_id = 1;
  string code = 2;
  string name = 3;
  Category category = 4;
  Unit unit = 5;
  uint32 trial_count = 6;
  reserved 7;
  reserved "bilateral";
  ValueType value_type = 8;
  SideMode side_mode = 9;
  Normalization normalization = 10;
  optional ScoreDirection score_direction = 11;
  TrialAggregation trial_aggregation = 12;
  SideAggregation side_aggregation = 13;
  repeated ItemElement elements = 14;
}

message ListMeasurementItemsRequest {}

message ListMeasurementItemsResponse {
  repeated MeasurementItem measurement_items = 1;
}
